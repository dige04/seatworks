<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="The watch reads each Lead&#x27;s and Peer&#x27;s turns, the decisions they make through the desk, and each lane&#x27;s record. Code turns what it can count into facts; the brains ask a catalog of patterns one condition at a time: a sensor sifts and the Watcher seat judges what it flagged. Everything found is an incident for the Supervisor, which marks it useful, noise or unknown and decides whether to step in. The seat it is about never hears of it."><title>The watch reads each Lead's and Peer's turns, the decisions they make through the desk, and each lane's record. Code turns what it can count into facts; the brains ask a catalog of patterns one condition at a time: a sensor sifts and the Watcher seat judges what it flagged. Everything found is an incident for the Supervisor, which marks it useful, noise or unknown and decides whether to step in. The seat it is about never hears of it.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="599" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">W: the watch sees and reports</text><text class="lede" x="32" y="72">What code can count is a fact; what takes judgement goes to the brains. The Supervisor decides what to do.</text><rect x="24" y="96" width="264" height="376" rx="14" style="fill:var(--slate-fill);fill-opacity:0.5;stroke:var(--slate);stroke-opacity:0.28"/><text class="band-label" x="40" y="118" style="fill:var(--slate-ink)">WHAT IT READS</text><rect x="44" y="128" width="224" height="80" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="156.0" y="156.0" text-anchor="middle" style="fill:var(--slate-ink)">Turns</text><text class="s" x="156.0" y="173.0" text-anchor="middle">thinking, words and calls,</text><text class="s" x="156.0" y="190.0" text-anchor="middle">every few minutes</text><path class="edge" d="M268,168 L300,168" style="stroke:var(--slate)"/><rect x="44" y="238" width="224" height="80" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="156.0" y="266.0" text-anchor="middle" style="fill:var(--slate-ink)">Decisions</text><text class="s" x="156.0" y="283.0" text-anchor="middle">accept, rework, ready,</text><text class="s" x="156.0" y="300.0" text-anchor="middle">a brief, a review's verdict</text><path class="edge" d="M268,278 L300,278" style="stroke:var(--slate)"/><rect x="44" y="348" width="224" height="80" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="156.0" y="376.0" text-anchor="middle" style="fill:var(--slate-ink)">The lane's record</text><text class="s" x="156.0" y="393.0" text-anchor="middle">sendings-back, reviews,</text><text class="s" x="156.0" y="410.0" text-anchor="middle">detours, gate runs</text><path class="edge" d="M268,388 L300,388" style="stroke:var(--slate)"/><path class="edge" d="M300,168 L300,388" style="stroke:var(--slate)"/><rect x="336" y="96" width="288" height="376" rx="14" style="fill:var(--rose-fill);fill-opacity:0.5;stroke:var(--rose);stroke-opacity:0.28"/><text class="band-label" x="352" y="118" style="fill:var(--rose-ink)">HOW IT READS</text><rect x="356" y="128" width="248" height="116" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="157.0" text-anchor="middle" style="fill:var(--rose-ink)">Code facts</text><text class="s" x="480.0" y="174.0" text-anchor="middle">a destructive command · a secret</text><text class="s" x="480.0" y="191.0" text-anchor="middle">a weakened test · round in circles</text><text class="s" x="480.0" y="208.0" text-anchor="middle">an accept with nothing read</text><text class="s" x="480.0" y="225.0" text-anchor="middle">a lane ready with no push-back</text><rect x="356" y="284" width="248" height="72" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="308.0" text-anchor="middle" style="fill:var(--rose-ink)">Sensor</text><text class="s" x="480.0" y="325.0" text-anchor="middle">one condition at a time,</text><text class="s" x="480.0" y="342.0" text-anchor="middle">flags what holds</text><rect x="356" y="380" width="248" height="72" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="404.0" text-anchor="middle" style="fill:var(--rose-ink)">Watcher seat</text><text class="s" x="480.0" y="421.0" text-anchor="middle">judges what the sensor</text><text class="s" x="480.0" y="438.0" text-anchor="middle">flagged or left unsure</text><path class="edge" d="M480,356 L480,376" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><path class="edge" d="M300,186 L352,186" style="stroke:var(--slate)" marker-end="url(#a-slate)"/><path class="edge" d="M300,320 L352,320" style="stroke:var(--slate)" marker-end="url(#a-slate)"/><rect x="284.2" y="242" width="67.5" height="20" rx="10" style="fill:var(--bg);stroke:var(--slate);stroke-opacity:0.55"/><text class="chip" x="318" y="256" text-anchor="middle" style="fill:var(--slate-ink)">patterns</text><rect x="660" y="96" width="276" height="376" rx="14" style="fill:var(--violet-fill);fill-opacity:0.5;stroke:var(--violet);stroke-opacity:0.28"/><text class="band-label" x="676" y="118" style="fill:var(--violet-ink)">WHO DECIDES</text><rect x="680" y="128" width="236" height="76" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="798.0" y="154.0" text-anchor="middle" style="fill:var(--violet-ink)">Incident book</text><text class="s" x="798.0" y="171.0" text-anchor="middle">one per project; a kind marked</text><text class="s" x="798.0" y="188.0" text-anchor="middle">noise is not told again</text><rect x="680" y="260" width="236" height="92" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="798.0" y="285.5" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text><text class="s" x="798.0" y="302.5" text-anchor="middle">marks useful, noise, unknown;</text><text class="s" x="798.0" y="319.5" text-anchor="middle">then nothing, a question,</text><text class="s" x="798.0" y="336.5" text-anchor="middle">a council, a hold, or you</text><path class="edge" d="M604,166 L676,166" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><path class="edge" d="M604,416 L631.0,416.0 Q640,416 640.0,407.0 L640.0,195.0 Q640,186 649.0,186.0 L676,186" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><path class="edge" d="M798,204 L798,256" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="24" y="488" width="912" height="92" rx="14" style="fill:var(--slate-fill);fill-opacity:0.5;stroke:var(--slate);stroke-opacity:0.28"/><text class="note strong" x="44" y="516" text-anchor="start">Rules the watch keeps</text><text class="note" x="44" y="534" text-anchor="start">It never tells the seat it is about, never steps in, and has no switch per signal.</text><text class="note" x="44" y="552" text-anchor="start">attention.brain picks the brains: the sensor, the Watcher seat, both, or off.</text></svg>

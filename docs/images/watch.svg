<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-label="The watch reads a Lead&#x27;s or Peer&#x27;s turns every few minutes and at a turn&#x27;s end, each decision it makes through the desk as it makes it, and each lane&#x27;s record. Code turns what it can count into facts; what takes judgement is a case of patterns, one condition each, that a sensor sifts and the Watcher seat judges. Everything found goes into the incident book and to the Supervisor, which answers with nothing, a question to the Lead, a council, a hold or the Human, and marks it useful, noise or unknown. The seat it is about never hears of it."><title>The watch reads a Lead's or Peer's turns every few minutes and at a turn's end, each decision it makes through the desk as it makes it, and each lane's record. Code turns what it can count into facts; what takes judgement is a case of patterns, one condition each, that a sensor sifts and the Watcher seat judges. Everything found goes into the incident book and to the Supervisor, which answers with nothing, a question to the Lead, a council, a hold or the Human, and marks it useful, noise or unknown. The seat it is about never hears of it.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="939" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">W: the watch sees and reports</text><text class="lede" x="32" y="72">One eye on Leads and Peers, two brains, one incident book, one reader: the Supervisor, which alone decides.</text><rect x="24" y="96" width="912" height="150" rx="14" style="fill:var(--slate-fill);fill-opacity:0.5;stroke:var(--slate);stroke-opacity:0.28"/><text class="band-label" x="40" y="118" style="fill:var(--slate-ink)">1 · WHAT IT READS · LEADS AND PEERS ONLY</text><rect x="44" y="126" width="280" height="100" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="184.0" y="155.5" text-anchor="middle" style="fill:var(--slate-ink)">Turns</text><text class="s" x="184.0" y="172.5" text-anchor="middle">new thinking, words and calls,</text><text class="s" x="184.0" y="189.5" text-anchor="middle">every few minutes and</text><text class="s" x="184.0" y="206.5" text-anchor="middle">at each turn's end</text><rect x="340" y="126" width="280" height="100" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="155.5" text-anchor="middle" style="fill:var(--slate-ink)">Decisions</text><text class="s" x="480.0" y="172.5" text-anchor="middle">as a seat calls accept, rework,</text><text class="s" x="480.0" y="189.5" text-anchor="middle">report, add_tasks, amend_task,</text><text class="s" x="480.0" y="206.5" text-anchor="middle">or a review's done</text><rect x="636" y="126" width="280" height="100" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="776.0" y="155.5" text-anchor="middle" style="fill:var(--slate-ink)">The lane's record</text><text class="s" x="776.0" y="172.5" text-anchor="middle">the ledger: sendings-back,</text><text class="s" x="776.0" y="189.5" text-anchor="middle">reviews, detours, gate runs,</text><text class="s" x="776.0" y="206.5" text-anchor="middle">read by the patrol</text><rect x="24" y="266" width="912" height="262" rx="14" style="fill:var(--rose-fill);fill-opacity:0.5;stroke:var(--rose);stroke-opacity:0.28"/><text class="band-label" x="40" y="288" style="fill:var(--rose-ink)">2 · TWO WAYS TO SEE</text><rect x="44" y="298" width="340" height="210" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="214.0" y="357.0" text-anchor="middle" style="fill:var(--rose-ink)">Code facts</text><text class="s" x="214.0" y="374.0" text-anchor="middle">counted or matched, no model:</text><text class="s" x="214.0" y="391.0" text-anchor="middle">a destructive command, a secret,</text><text class="s" x="214.0" y="408.0" text-anchor="middle">data sent off the machine,</text><text class="s" x="214.0" y="425.0" text-anchor="middle">a weakened test, round in circles,</text><text class="s" x="214.0" y="442.0" text-anchor="middle">an accept with nothing read,</text><text class="s" x="214.0" y="459.0" text-anchor="middle">a lane ready with no push-back</text><rect x="420" y="298" width="496" height="64" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="668.0" y="326.5" text-anchor="middle" style="fill:var(--rose-ink)">Patterns</text><text class="s" x="668.0" y="343.5" text-anchor="middle">from the anti-patterns list, one condition each</text><rect x="420" y="382" width="152" height="126" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="496.0" y="416.0" text-anchor="middle" style="fill:var(--rose-ink)">Sensor</text><text class="s" x="496.0" y="433.0" text-anchor="middle">asks each item</text><text class="s" x="496.0" y="450.0" text-anchor="middle">one condition at</text><text class="s" x="496.0" y="467.0" text-anchor="middle">a time; flags</text><text class="s" x="496.0" y="484.0" text-anchor="middle">what holds</text><rect x="592" y="382" width="152" height="126" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="668.0" y="416.0" text-anchor="middle" style="fill:var(--rose-ink)">Case queue</text><text class="s" x="668.0" y="433.0" text-anchor="middle">one per seat,</text><text class="s" x="668.0" y="450.0" text-anchor="middle">subject, episode;</text><text class="s" x="668.0" y="467.0" text-anchor="middle">a newer look</text><text class="s" x="668.0" y="484.0" text-anchor="middle">folds in</text><rect x="764" y="382" width="152" height="126" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="840.0" y="416.0" text-anchor="middle" style="fill:var(--rose-ink)">Watcher seat</text><text class="s" x="840.0" y="433.0" text-anchor="middle">judges the case:</text><text class="s" x="840.0" y="450.0" text-anchor="middle">only what the</text><text class="s" x="840.0" y="467.0" text-anchor="middle">sensor flagged</text><text class="s" x="840.0" y="484.0" text-anchor="middle">or left unsure</text><path class="edge" d="M668,362 L668.0,367.0 Q668,372 659.0,372.0 L505.0,372.0 Q496,372 496.0,375.0 L496,378" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><path class="edge" d="M572,445 L588,445" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><path class="edge" d="M744,445 L760,445" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><path class="edge" d="M184,226 L184,262" style="stroke:var(--slate)"/><path class="edge" d="M480,226 L480,262" style="stroke:var(--slate)"/><path class="edge" d="M776,226 L776,262" style="stroke:var(--slate)"/><path class="edge" d="M184,256 L776,256" style="stroke:var(--slate)"/><path class="edge" d="M214,256 L214,294" style="stroke:var(--slate)" marker-end="url(#a-slate)"/><path class="edge" d="M668,256 L668,294" style="stroke:var(--slate)" marker-end="url(#a-slate)"/><rect x="24" y="548" width="912" height="150" rx="14" style="fill:var(--violet-fill);fill-opacity:0.5;stroke:var(--violet);stroke-opacity:0.28"/><text class="band-label" x="40" y="570" style="fill:var(--violet-ink)">3 · ONE BOOK, ONE READER</text><rect x="44" y="578" width="420" height="100" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="254.0" y="607.5" text-anchor="middle" style="fill:var(--violet-ink)">Incident book</text><text class="s" x="254.0" y="624.5" text-anchor="middle">a finding joins the incident still open;</text><text class="s" x="254.0" y="641.5" text-anchor="middle">a kind marked noise is not told again</text><text class="s" x="254.0" y="658.5" text-anchor="middle">about that seat and task</text><rect x="496" y="578" width="420" height="100" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="706.0" y="616.0" text-anchor="middle" style="fill:var(--violet-ink)">Letter to the Supervisor</text><text class="s" x="706.0" y="633.0" text-anchor="middle">what cannot be undone first, at once;</text><text class="s" x="706.0" y="650.0" text-anchor="middle">never to the seat it is about</text><path class="edge" d="M214,508 L214,574" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><rect x="189.9" y="530" width="48.2" height="20" rx="10" style="fill:var(--bg);stroke:var(--rose);stroke-opacity:0.55"/><text class="chip" x="214" y="544" text-anchor="middle" style="fill:var(--rose-ink)">facts</text><path class="edge" d="M840,508 L840.0,527.0 Q840,536 831.0,536.0 L409.0,536.0 Q400,536 400.0,545.0 L400,574" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><rect x="547.6" y="526" width="144.8" height="20" rx="10" style="fill:var(--bg);stroke:var(--rose);stroke-opacity:0.55"/><text class="chip" x="620" y="540" text-anchor="middle" style="fill:var(--rose-ink)">what it judged found</text><path class="edge" d="M464,628 L492,628" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="24" y="718" width="912" height="198" rx="14" style="fill:var(--violet-fill);fill-opacity:0.5;stroke:var(--violet);stroke-opacity:0.28"/><text class="band-label" x="40" y="740" style="fill:var(--violet-ink)">4 · THE SUPERVISOR DECIDES; THE WATCH NEVER DOES</text><rect x="44" y="750" width="164" height="72" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="126.0" y="774.0" text-anchor="middle" style="fill:var(--violet-ink)">Nothing</text><text class="s" x="126.0" y="791.0" text-anchor="middle">the record already</text><text class="s" x="126.0" y="808.0" text-anchor="middle">answers</text><rect x="220" y="750" width="164" height="72" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="302.0" y="774.0" text-anchor="middle" style="fill:var(--violet-ink)">A question</text><text class="s" x="302.0" y="791.0" text-anchor="middle">one open question to</text><text class="s" x="302.0" y="808.0" text-anchor="middle">the Lead</text><rect x="396" y="750" width="164" height="72" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="478.0" y="782.5" text-anchor="middle" style="fill:var(--violet-ink)">A council</text><text class="s" x="478.0" y="799.5" text-anchor="middle">several lenses on it</text><rect x="572" y="750" width="164" height="72" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="654.0" y="774.0" text-anchor="middle" style="fill:var(--violet-ink)">A hold</text><text class="s" x="654.0" y="791.0" text-anchor="middle">the lane stops at</text><text class="s" x="654.0" y="808.0" text-anchor="middle">once</text><rect x="748" y="750" width="164" height="72" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="830.0" y="774.0" text-anchor="middle" style="fill:var(--violet-ink)">The Human</text><text class="s" x="830.0" y="791.0" text-anchor="middle">while they are in</text><text class="s" x="830.0" y="808.0" text-anchor="middle">the loop</text><rect x="44" y="842" width="872" height="54" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="865.5" text-anchor="middle" style="fill:var(--slate-ink)">Then it marks the incident useful, noise or unknown</text><text class="s" x="480.0" y="882.5" text-anchor="middle">noise: that kind is not told again about the same seat and task</text><path class="edge" d="M706,678 L706.0,689.0 Q706,698 697.0,698.0 L489.0,698.0 Q480,698 480.0,707.0 L480,746" style="stroke:var(--violet)" marker-end="url(#a-violet)"/></svg>

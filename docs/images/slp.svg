<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-label="The Human owns the intent and the concept. The Supervisor owns the intent across lanes and landing them, and never writes code. A Lead owns one lane and the acceptance of its work, and writes no code. A Peer owns one task and the engineering judgement in it, and may refuse the Lead&#x27;s framing. The Supervisor reaches a Peer only with its Lead told first."><title>The Human owns the intent and the concept. The Supervisor owns the intent across lanes and landing them, and never writes code. A Lead owns one lane and the acceptance of its work, and writes no code. A Peer owns one task and the engineering judgement in it, and may refuse the Lead's framing. The Supervisor reaches a Peer only with its Lead told first.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="659" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">SLP: each role holds its own axis</text><text class="lede" x="32" y="72">Not a chain of command. Each seat decides what is its own and nothing else; the plugin decides none of it.</text><rect x="330" y="96" width="300" height="60" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="122.5" text-anchor="middle" style="fill:var(--slate-ink)">Human</text><text class="s" x="480.0" y="139.5" text-anchor="middle">the intent, the priorities, the concept</text><rect x="48" y="196" width="264" height="360" rx="14" style="fill:var(--violet-fill);fill-opacity:0.5;stroke:var(--violet);stroke-opacity:0.28"/><rect x="64" y="212" width="232" height="56" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="180.0" y="236.5" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text><text class="s" x="180.0" y="253.5" text-anchor="middle">across lanes</text><text class="k" x="70" y="292" style="fill:var(--violet)">OWNS</text><text class="note" x="70" y="314" text-anchor="start">your intent across lanes</text><text class="note" x="70" y="332" text-anchor="start">which lanes, and landing them</text><text class="k" x="70" y="376" style="fill:var(--violet)">DECIDES</text><text class="note" x="70" y="398" text-anchor="start">when to step in: a question,</text><text class="note" x="70" y="416" text-anchor="start">a council, a hold, or you</text><text class="k" x="70" y="460" style="fill:var(--violet)">NEVER</text><text class="note" x="70" y="482" text-anchor="start">writes code or decides</text><text class="note" x="70" y="500" text-anchor="start">a technical result</text><rect x="348" y="196" width="264" height="360" rx="14" style="fill:var(--blue-fill);fill-opacity:0.5;stroke:var(--blue);stroke-opacity:0.28"/><rect x="364" y="212" width="232" height="56" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="236.5" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text><text class="s" x="480.0" y="253.5" text-anchor="middle">one lane</text><text class="k" x="370" y="292" style="fill:var(--blue)">OWNS</text><text class="note" x="370" y="314" text-anchor="start">its tasks, their order, who</text><text class="note" x="370" y="332" text-anchor="start">holds what, and integration</text><text class="k" x="370" y="376" style="fill:var(--blue)">DECIDES</text><text class="note" x="370" y="398" text-anchor="start">acceptance: accept, send</text><text class="note" x="370" y="416" text-anchor="start">back or cut each task</text><text class="k" x="370" y="460" style="fill:var(--blue)">NEVER</text><text class="note" x="370" y="482" text-anchor="start">writes the code: its</text><text class="note" x="370" y="500" text-anchor="start">Peers do</text><rect x="648" y="196" width="264" height="360" rx="14" style="fill:var(--green-fill);fill-opacity:0.5;stroke:var(--green);stroke-opacity:0.28"/><rect x="664" y="212" width="232" height="56" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="780.0" y="236.5" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><text class="s" x="780.0" y="253.5" text-anchor="middle">one task</text><text class="k" x="670" y="292" style="fill:var(--green)">OWNS</text><text class="note" x="670" y="314" text-anchor="start">one task, on a branch</text><text class="note" x="670" y="332" text-anchor="start">of its own</text><text class="k" x="670" y="376" style="fill:var(--green)">DECIDES</text><text class="note" x="670" y="398" text-anchor="start">the engineering inside it;</text><text class="note" x="670" y="416" text-anchor="start">may refuse the framing</text><text class="k" x="670" y="460" style="fill:var(--green)">NEVER</text><text class="note" x="670" y="482" text-anchor="start">takes another task,</text><text class="note" x="670" y="500" text-anchor="start">or pushes</text><path class="edge" d="M480,156 L480.0,167.0 Q480,176 471.0,176.0 L189.0,176.0 Q180,176 180.0,184.0 L180,192" style="stroke:var(--slate)" marker-end="url(#a-slate)"/><rect x="270.5" y="166" width="119.0" height="20" rx="10" style="fill:var(--bg);stroke:var(--slate);stroke-opacity:0.55"/><text class="chip" x="330" y="180" text-anchor="middle" style="fill:var(--slate-ink)">intent · answers</text><path class="edge" d="M312,240 L360,240" style="stroke:var(--violet)" marker-end="url(#a-violet)" marker-start="url(#a-violet)"/><path class="edge" d="M612,240 L660,240" style="stroke:var(--blue)" marker-end="url(#a-blue)" marker-start="url(#a-blue)"/><rect x="24" y="576" width="912" height="64" rx="14" style="fill:var(--slate-fill);fill-opacity:0.5;stroke:var(--slate);stroke-opacity:0.28"/><text class="note strong" x="44" y="602" text-anchor="start">Who speaks to whom</text><text class="note" x="44" y="620" text-anchor="start">Human ↔ Supervisor ↔ Lead ↔ Peer. The Supervisor may reach a Peer, but the desk tells its Lead first.</text></svg>

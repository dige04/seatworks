<svg xmlns="http://www.w3.org/2000/svg" width="960" height="968" viewBox="0 0 960 968" role="img" aria-label="A swimlane of one lane: the Supervisor opens it and the desk seats its Lead; the Lead has a Reviewer scout the code, splits the work by file, and the desk seats a Peer per task. Each Peer works and hands back; a Reviewer checks the change; the Lead accepts it, and the desk runs the gate and merges it, or sends it back. The last merge wakes the Lead for a whole-lane review; it reports ready with the desk&#x27;s facts, and the Supervisor lands the lane."><title>A swimlane of one lane: the Supervisor opens it and the desk seats its Lead; the Lead has a Reviewer scout the code, splits the work by file, and the desk seats a Peer per task. Each Peer works and hands back; a Reviewer checks the change; the Lead accepts it, and the desk runs the gate and merges it, or sends it back. The last merge wakes the Lead for a whole-lane review; it reports ready with the desk's facts, and the Supervisor lands the lane.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="967" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">A lane, from open to landed</text><text class="lede" x="32" y="72">Each row is one step: who acts, and who the desk hands it to. The seats decide; the desk carries.</text><rect x="30" y="92" width="176" height="760" rx="14" style="fill:var(--violet-fill);fill-opacity:0.5;stroke:var(--violet);stroke-opacity:0.28"/><rect x="77.8" y="106" width="80.4" height="20" rx="10" style="fill:var(--bg);stroke:var(--violet);stroke-opacity:0.55"/><text class="chip" x="118" y="120" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text><rect x="213" y="92" width="176" height="760" rx="14" style="fill:var(--blue-fill);fill-opacity:0.5;stroke:var(--blue);stroke-opacity:0.28"/><rect x="280.1" y="106" width="41.8" height="20" rx="10" style="fill:var(--bg);stroke:var(--blue);stroke-opacity:0.55"/><text class="chip" x="301" y="120" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text><rect x="396" y="92" width="176" height="760" rx="14" style="fill:var(--green-fill);fill-opacity:0.5;stroke:var(--green);stroke-opacity:0.28"/><rect x="463.1" y="106" width="41.8" height="20" rx="10" style="fill:var(--bg);stroke:var(--green);stroke-opacity:0.55"/><text class="chip" x="484" y="120" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><rect x="579" y="92" width="176" height="760" rx="14" style="fill:var(--amber-fill);fill-opacity:0.5;stroke:var(--amber);stroke-opacity:0.28"/><rect x="633.2" y="106" width="67.5" height="20" rx="10" style="fill:var(--bg);stroke:var(--amber);stroke-opacity:0.55"/><text class="chip" x="667" y="120" text-anchor="middle" style="fill:var(--amber-ink)">Reviewer</text><rect x="762" y="92" width="176" height="760" rx="14" style="fill:var(--teal-fill);fill-opacity:0.5;stroke:var(--teal);stroke-opacity:0.28"/><rect x="829.1" y="106" width="41.8" height="20" rx="10" style="fill:var(--bg);stroke:var(--teal);stroke-opacity:0.55"/><text class="chip" x="850" y="120" text-anchor="middle" style="fill:var(--teal-ink)">Desk</text><rect x="36.0" y="160" width="164" height="46" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="118.0" y="179.5" text-anchor="middle" style="fill:var(--violet-ink)">open_lane</text><text class="s" x="118.0" y="196.5" text-anchor="middle">outcome · acceptance</text><circle cx="36.0" cy="160" r="11" style="fill:var(--violet)"/><text class="badge" x="36.0" y="164" text-anchor="middle">1</text><rect x="768.0" y="160" width="164" height="46" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="850.0" y="179.5" text-anchor="middle" style="fill:var(--teal-ink)">seats its Lead</text><text class="s" x="850.0" y="196.5" text-anchor="middle">a lane branch or copy</text><path class="edge" d="M200.0,183.0 L764.0,183.0" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="219.0" y="222" width="164" height="46" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="301.0" y="241.5" text-anchor="middle" style="fill:var(--blue-ink)">start_review</text><text class="s" x="301.0" y="258.5" text-anchor="middle">a scout's question</text><circle cx="219.0" cy="222" r="11" style="fill:var(--blue)"/><text class="badge" x="219.0" y="226" text-anchor="middle">2</text><rect x="585.0" y="222" width="164" height="46" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="667.0" y="241.5" text-anchor="middle" style="fill:var(--amber-ink)">reads the code</text><text class="s" x="667.0" y="258.5" text-anchor="middle">changes nothing</text><path class="edge" d="M383.0,245.0 L581.0,245.0" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><rect x="219.0" y="284" width="164" height="46" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="301.0" y="303.5" text-anchor="middle" style="fill:var(--blue-ink)">add_tasks</text><text class="s" x="301.0" y="320.5" text-anchor="middle">split by the files</text><circle cx="219.0" cy="284" r="11" style="fill:var(--blue)"/><text class="badge" x="219.0" y="288" text-anchor="middle">3</text><rect x="768.0" y="284" width="164" height="46" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="850.0" y="303.5" text-anchor="middle" style="fill:var(--teal-ink)">a branch each</text><text class="s" x="850.0" y="320.5" text-anchor="middle">seats a Peer per task</text><path class="edge" d="M383.0,307.0 L764.0,307.0" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><rect x="402.0" y="346" width="164" height="46" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="484.0" y="365.5" text-anchor="middle" style="fill:var(--green-ink)">works, then done</text><text class="s" x="484.0" y="382.5" text-anchor="middle">a hand-back: what ran</text><circle cx="402.0" cy="346" r="11" style="fill:var(--green)"/><text class="badge" x="402.0" y="350" text-anchor="middle">4</text><rect x="219.0" y="408" width="164" height="46" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="301.0" y="427.5" text-anchor="middle" style="fill:var(--blue-ink)">start_review</text><text class="s" x="301.0" y="444.5" text-anchor="middle">one task's change</text><circle cx="219.0" cy="408" r="11" style="fill:var(--blue)"/><text class="badge" x="219.0" y="412" text-anchor="middle">5</text><rect x="585.0" y="408" width="164" height="46" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="667.0" y="427.5" text-anchor="middle" style="fill:var(--amber-ink)">runs its checks</text><text class="s" x="667.0" y="444.5" text-anchor="middle">findings, P0 to P3</text><path class="edge" d="M383.0,431.0 L581.0,431.0" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><rect x="219.0" y="470" width="164" height="46" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="301.0" y="489.5" text-anchor="middle" style="fill:var(--blue-ink)">accept</text><text class="s" x="301.0" y="506.5" text-anchor="middle">the Lead's call</text><circle cx="219.0" cy="470" r="11" style="fill:var(--blue)"/><text class="badge" x="219.0" y="474" text-anchor="middle">6</text><rect x="768.0" y="470" width="164" height="46" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="850.0" y="489.5" text-anchor="middle" style="fill:var(--teal-ink)">gate, then merge</text><text class="s" x="850.0" y="506.5" text-anchor="middle">into the lane</text><path class="edge" d="M383.0,493.0 L764.0,493.0" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><rect x="219.0" y="532" width="164" height="46" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="301.0" y="551.5" text-anchor="middle" style="fill:var(--blue-ink)">rework</text><text class="s" x="301.0" y="568.5" text-anchor="middle">P0 to P2, reproduced</text><circle cx="219.0" cy="532" r="11" style="fill:var(--blue)"/><text class="badge" x="219.0" y="536" text-anchor="middle">7</text><rect x="402.0" y="532" width="164" height="46" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="484.0" y="551.5" text-anchor="middle" style="fill:var(--green-ink)">back to its Peer</text><text class="s" x="484.0" y="568.5" text-anchor="middle">the same branch</text><path class="edge dash" d="M383.0,555.0 L398.0,555.0" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><rect x="768.0" y="594" width="164" height="46" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="850.0" y="613.5" text-anchor="middle" style="fill:var(--teal-ink)">last task merged</text><text class="s" x="850.0" y="630.5" text-anchor="middle">MERGED wakes the Lead</text><circle cx="768.0" cy="594" r="11" style="fill:var(--teal)"/><text class="badge" x="768.0" y="598" text-anchor="middle">8</text><rect x="219.0" y="594" width="164" height="46" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="301.0" y="613.5" text-anchor="middle" style="fill:var(--blue-ink)">whole-lane review</text><text class="s" x="301.0" y="630.5" text-anchor="middle">scope: lane</text><path class="edge" d="M768.0,617.0 L387.0,617.0" style="stroke:var(--teal)" marker-end="url(#a-teal)"/><rect x="585.0" y="656" width="164" height="46" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="667.0" y="675.5" text-anchor="middle" style="fill:var(--amber-ink)">reviews the lane</text><text class="s" x="667.0" y="692.5" text-anchor="middle">diff vs acceptance</text><circle cx="585.0" cy="656" r="11" style="fill:var(--amber)"/><text class="badge" x="585.0" y="660" text-anchor="middle">9</text><rect x="219.0" y="718" width="164" height="46" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="301.0" y="737.5" text-anchor="middle" style="fill:var(--blue-ink)">report ready</text><text class="s" x="301.0" y="754.5" text-anchor="middle">the lane is done</text><circle cx="219.0" cy="718" r="11" style="fill:var(--blue)"/><text class="badge" x="219.0" y="722" text-anchor="middle">10</text><rect x="768.0" y="718" width="164" height="46" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="850.0" y="737.5" text-anchor="middle" style="fill:var(--teal-ink)">gate · rehearsals</text><text class="s" x="850.0" y="754.5" text-anchor="middle">READY to Supervisor</text><path class="edge" d="M383.0,741.0 L764.0,741.0" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><rect x="36.0" y="780" width="164" height="46" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="118.0" y="799.5" text-anchor="middle" style="fill:var(--violet-ink)">land_lane</text><text class="s" x="118.0" y="816.5" text-anchor="middle">the Supervisor's call</text><circle cx="36.0" cy="780" r="11" style="fill:var(--violet)"/><text class="badge" x="36.0" y="784" text-anchor="middle">11</text><rect x="768.0" y="780" width="164" height="46" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="850.0" y="799.5" text-anchor="middle" style="fill:var(--teal-ink)">base, gate, land</text><text class="s" x="850.0" y="816.5" text-anchor="middle">LANDED or NOT LANDED</text><path class="edge" d="M200.0,803.0 L764.0,803.0" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="24" y="864" width="912" height="84" rx="14" style="fill:var(--slate-fill);fill-opacity:0.5;stroke:var(--slate);stroke-opacity:0.28"/><text class="note strong" x="44" y="892" text-anchor="start">A seat's turn in the way</text><text class="note" x="44" y="910" text-anchor="start">the landing is a standing order: the</text><text class="note" x="44" y="928" text-anchor="start">desk lands it when the turn ends</text><text class="note strong" x="344" y="892" text-anchor="start">A red gate or a conflicting base</text><text class="note" x="344" y="910" text-anchor="start">not landed: the Lead has the facts</text><text class="note" x="344" y="928" text-anchor="start">the Supervisor decides who takes it in</text><text class="note strong" x="644" y="892" text-anchor="start">A path you asked to see first</text><text class="note" x="644" y="910" text-anchor="start">waits for your card, in the loop</text><text class="note" x="644" y="928" text-anchor="start">out of it, an audit lane checks a push</text></svg>

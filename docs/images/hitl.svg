<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-label="In the loop: a seat&#x27;s question reaches the Supervisor, which answers what is its own and queues the rest for the Human, at most three a day, each with a recommendation; a reversible one goes ahead on it, a costly one stops its lane at the ready report, an irreversible one holds what it decides. Landings on paths the Human asked to see first, seats&#x27; permission prompts, and pushing wait for the Human. Out of the loop: the Supervisor decides, lands, answers permission prompts with permit, and pushes with an audit lane beside the last lanes; the Human is grilled only on the concept, which goes into CONTEXT.md, and reads what was decided for them in the report."><title>In the loop: a seat's question reaches the Supervisor, which answers what is its own and queues the rest for the Human, at most three a day, each with a recommendation; a reversible one goes ahead on it, a costly one stops its lane at the ready report, an irreversible one holds what it decides. Landings on paths the Human asked to see first, seats' permission prompts, and pushing wait for the Human. Out of the loop: the Supervisor decides, lands, answers permission prompts with permit, and pushes with an audit lane beside the last lanes; the Human is grilled only on the concept, which goes into CONTEXT.md, and reads what was decided for them in the report.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="939" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">The Human in the loop: one switch, hitl.on</text><text class="lede" x="32" y="72">On, what only you may decide waits for you. Off, the default, only the concept is yours; the Supervisor decides the rest.</text><rect x="24" y="96" width="912" height="404" rx="14" style="fill:var(--blue-fill);fill-opacity:0.5;stroke:var(--blue);stroke-opacity:0.28"/><text class="band-label" x="40" y="118" style="fill:var(--blue-ink)">ON · IN THE LOOP</text><rect x="44" y="132" width="190" height="88" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="139.0" y="155.5" text-anchor="middle" style="fill:var(--green-ink)">A Lead or Peer</text><text class="s" x="139.0" y="172.5" text-anchor="middle">asks, needs a</text><text class="s" x="139.0" y="189.5" text-anchor="middle">permission, or</text><text class="s" x="139.0" y="206.5" text-anchor="middle">reports ready</text><rect x="274" y="132" width="190" height="88" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="369.0" y="164.0" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text><text class="s" x="369.0" y="181.0" text-anchor="middle">answers what is</text><text class="s" x="369.0" y="198.0" text-anchor="middle">its own to decide</text><rect x="504" y="132" width="196" height="88" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="602.0" y="155.5" text-anchor="middle" style="fill:var(--blue-ink)">Your question queue</text><text class="s" x="602.0" y="172.5" text-anchor="middle">a card in its chat;</text><text class="s" x="602.0" y="189.5" text-anchor="middle">at most 3 a day, with</text><text class="s" x="602.0" y="206.5" text-anchor="middle">its recommendation</text><path class="edge" d="M234,176 L270,176" style="stroke:var(--green)" marker-end="url(#a-green)"/><path class="edge" d="M464,176 L500,176" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="448.2" y="140" width="67.5" height="20" rx="10" style="fill:var(--bg);stroke:var(--violet);stroke-opacity:0.55"/><text class="chip" x="482" y="154" text-anchor="middle" style="fill:var(--violet-ink)">only you</text><rect x="736" y="124" width="180" height="56" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="826.0" y="148.5" text-anchor="middle" style="fill:var(--blue-ink)">reversible</text><text class="s" x="826.0" y="165.5" text-anchor="middle">goes ahead on it now</text><rect x="736" y="188" width="180" height="56" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="826.0" y="212.5" text-anchor="middle" style="fill:var(--blue-ink)">costly</text><text class="s" x="826.0" y="229.5" text-anchor="middle">stops the lane at ready</text><rect x="736" y="252" width="180" height="56" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="826.0" y="276.5" text-anchor="middle" style="fill:var(--blue-ink)">irreversible</text><text class="s" x="826.0" y="293.5" text-anchor="middle">holds what it decides</text><path class="edge" d="M700,176 L718,176" style="stroke:var(--blue)"/><path class="edge" d="M718,152 L718,280" style="stroke:var(--blue)"/><path class="edge" d="M718,152 L732,152" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><path class="edge" d="M718,216 L732,216" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><path class="edge" d="M718,280 L732,280" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><text class="note" x="736" y="330" text-anchor="start">what each class lets go on</text><text class="note" x="736" y="348" text-anchor="start">while you are silent</text><rect x="44" y="368" width="190" height="34" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="139.0" y="390.0" text-anchor="middle" style="fill:var(--slate-ink)">A landing</text><text class="note" x="250" y="390">on a path you asked to see first</text><path class="edge" d="M470,385 L500,385" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><text class="note strong" x="508" y="390">waits for your card: approve or send back</text><rect x="44" y="410" width="190" height="34" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="139.0" y="432.0" text-anchor="middle" style="fill:var(--slate-ink)">A permission</text><text class="note" x="250" y="432">a seat's prompt in Paseo</text><path class="edge" d="M470,427 L500,427" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><text class="note strong" x="508" y="432">waits for you; its superior is told</text><rect x="44" y="452" width="190" height="34" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="139.0" y="474.0" text-anchor="middle" style="fill:var(--slate-ink)">Push, release</text><text class="note" x="250" y="474">sending base out, tagging</text><path class="edge" d="M470,469 L500,469" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><text class="note strong" x="508" y="474">yours: the Supervisor's push is refused</text><rect x="24" y="520" width="912" height="344" rx="14" style="fill:var(--violet-fill);fill-opacity:0.5;stroke:var(--violet);stroke-opacity:0.28"/><text class="band-label" x="40" y="542" style="fill:var(--violet-ink)">OFF · OUT OF THE LOOP · THE DEFAULT</text><rect x="44" y="556" width="190" height="88" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="139.0" y="579.5" text-anchor="middle" style="fill:var(--green-ink)">A Lead or Peer</text><text class="s" x="139.0" y="596.5" text-anchor="middle">asks, needs a</text><text class="s" x="139.0" y="613.5" text-anchor="middle">permission, or</text><text class="s" x="139.0" y="630.5" text-anchor="middle">reports ready</text><rect x="274" y="556" width="190" height="88" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="369.0" y="588.0" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text><text class="s" x="369.0" y="605.0" text-anchor="middle">decides everything</text><text class="s" x="369.0" y="622.0" text-anchor="middle">but the concept</text><path class="edge" d="M234,600 L270,600" style="stroke:var(--green)" marker-end="url(#a-green)"/><rect x="504" y="548" width="196" height="44" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="602.0" y="566.5" text-anchor="middle" style="fill:var(--violet-ink)">answers the seat</text><text class="s" x="602.0" y="583.5" text-anchor="middle">ask, answer</text><rect x="504" y="600" width="196" height="44" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="602.0" y="618.5" text-anchor="middle" style="fill:var(--violet-ink)">permit</text><text class="s" x="602.0" y="635.5" text-anchor="middle">a seat's permission</text><rect x="504" y="652" width="196" height="44" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="602.0" y="670.5" text-anchor="middle" style="fill:var(--violet-ink)">land_lane</text><text class="s" x="602.0" y="687.5" text-anchor="middle">no path waits for you</text><rect x="504" y="704" width="196" height="44" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="602.0" y="722.5" text-anchor="middle" style="fill:var(--violet-ink)">push</text><text class="s" x="602.0" y="739.5" text-anchor="middle">an audit lane checks it</text><path class="edge" d="M464,600 L486,600" style="stroke:var(--violet)"/><path class="edge" d="M486,570 L486,726" style="stroke:var(--violet)"/><path class="edge" d="M486,570 L500,570" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><path class="edge" d="M486,622 L500,622" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><path class="edge" d="M486,674 L500,674" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><path class="edge" d="M486,726 L500,726" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="736" y="556" width="180" height="88" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="826.0" y="588.0" text-anchor="middle" style="fill:var(--slate-ink)">The report card</text><text class="s" x="826.0" y="605.0" text-anchor="middle">what was decided</text><text class="s" x="826.0" y="622.0" text-anchor="middle">for you, and why</text><path class="edge" d="M700,648 L709.0,648.0 Q718,648 718.0,639.0 L718.0,609.0 Q718,600 725.0,600.0 L732,600" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="44" y="760" width="190" height="76" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="139.0" y="794.5" text-anchor="middle" style="fill:var(--slate-ink)">You</text><text class="s" x="139.0" y="811.5" text-anchor="middle">only the concept</text><rect x="274" y="760" width="426" height="76" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="487.0" y="786.0" text-anchor="middle" style="fill:var(--violet-ink)">The Supervisor grills you</text><text class="s" x="487.0" y="803.0" text-anchor="middle">in its own chat, with its agent's own question;</text><text class="s" x="487.0" y="820.0" text-anchor="middle">what you settle goes into CONTEXT.md</text><path class="edge" d="M270,798 L238,798" style="stroke:var(--violet)" marker-end="url(#a-violet)" marker-start="url(#a-violet)"/><rect x="736" y="760" width="180" height="76" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="826.0" y="786.0" text-anchor="middle" style="fill:var(--slate-ink)">CONTEXT.md</text><text class="s" x="826.0" y="803.0" text-anchor="middle">the concept, read</text><text class="s" x="826.0" y="820.0" text-anchor="middle">by every seat</text><path class="edge" d="M700,798 L732,798" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="24" y="880" width="912" height="44" rx="14" style="fill:var(--red-fill);fill-opacity:0.5;stroke:var(--red);stroke-opacity:0.28"/><text class="note" x="44" y="907" text-anchor="start">Either way: a command that cannot be undone reaches the Supervisor at once, which may hold the lane.</text></svg>

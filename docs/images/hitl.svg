<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="With the Human in the loop, questions queue for the Human with a recommendation, a landing on a path they asked to see first waits for their card, permission prompts wait in Paseo, and pushing is theirs. Out of the loop, the Supervisor decides, answers permission prompts with permit and pushes, with an audit lane beside the last lanes; only the concept still goes to the Human, through the Supervisor&#x27;s grilling."><title>With the Human in the loop, questions queue for the Human with a recommendation, a landing on a path they asked to see first waits for their card, permission prompts wait in Paseo, and pushing is theirs. Out of the loop, the Supervisor decides, answers permission prompts with permit and pushes, with an audit lane beside the last lanes; only the concept still goes to the Human, through the Supervisor's grilling.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="559" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">The Human in the loop is one switch</text><text class="lede" x="32" y="72">In the loop, what cannot be undone waits for you. Out of it, only the concept is yours; the Supervisor decides the rest.</text><rect x="378.4" y="98" width="151.2" height="20" rx="10" style="fill:var(--bg);stroke:var(--blue);stroke-opacity:0.55"/><text class="chip" x="454" y="112" text-anchor="middle" style="fill:var(--blue-ink)">IN THE LOOP · hitl on</text><rect x="652.5" y="98" width="235.0" height="20" rx="10" style="fill:var(--bg);stroke:var(--violet);stroke-opacity:0.55"/><text class="chip" x="770" y="112" text-anchor="middle" style="fill:var(--violet-ink)">OUT OF THE LOOP · off, the default</text><rect x="32" y="128" width="196" height="70" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="130.0" y="168.0" text-anchor="middle" style="fill:var(--slate-ink)">A decision</text><rect x="244" y="128" width="300" height="70" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="394.0" y="159.5" text-anchor="middle">on your question queue, with the</text><text class="s strongish" x="394.0" y="176.5" text-anchor="middle">recommendation; at most 3 a day</text><rect x="560" y="128" width="368" height="70" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="744.0" y="159.5" text-anchor="middle">the Supervisor decides; a</text><text class="s strongish" x="744.0" y="176.5" text-anchor="middle">decision it made is in the report</text><rect x="32" y="210" width="196" height="70" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="130.0" y="250.0" text-anchor="middle" style="fill:var(--slate-ink)">A landing</text><rect x="244" y="210" width="300" height="70" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="394.0" y="241.5" text-anchor="middle">a path you asked to see first</text><text class="s strongish" x="394.0" y="258.5" text-anchor="middle">waits for your card</text><rect x="560" y="210" width="368" height="70" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="744.0" y="250.0" text-anchor="middle">the Supervisor lands it</text><rect x="32" y="292" width="196" height="70" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="130.0" y="332.0" text-anchor="middle" style="fill:var(--slate-ink)">A seat's permission</text><rect x="244" y="292" width="300" height="70" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="394.0" y="323.5" text-anchor="middle">waits in Paseo for you;</text><text class="s strongish" x="394.0" y="340.5" text-anchor="middle">its superior is told</text><rect x="560" y="292" width="368" height="70" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="744.0" y="323.5" text-anchor="middle">the Supervisor answers it</text><text class="s strongish" x="744.0" y="340.5" text-anchor="middle">with permit</text><rect x="32" y="374" width="196" height="70" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="130.0" y="414.0" text-anchor="middle" style="fill:var(--slate-ink)">Push and release</text><rect x="244" y="374" width="300" height="70" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="394.0" y="414.0" text-anchor="middle">yours</text><rect x="560" y="374" width="368" height="70" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="744.0" y="405.5" text-anchor="middle">the Supervisor's push, audited by</text><text class="s strongish" x="744.0" y="422.5" text-anchor="middle">a lane beside the last lanes</text><rect x="32" y="456" width="196" height="70" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="130.0" y="496.0" text-anchor="middle" style="fill:var(--slate-ink)">The concept</text><rect x="244" y="456" width="300" height="70" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="394.0" y="487.5" text-anchor="middle">yours: the Supervisor grills you</text><text class="s strongish" x="394.0" y="504.5" text-anchor="middle">and writes CONTEXT.md</text><rect x="560" y="456" width="368" height="70" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="s strongish" x="744.0" y="487.5" text-anchor="middle">still yours, in the</text><text class="s strongish" x="744.0" y="504.5" text-anchor="middle">Supervisor's own chat</text></svg>

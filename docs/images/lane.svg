<svg xmlns="http://www.w3.org/2000/svg" width="960" height="564" viewBox="0 0 960 564" role="img" aria-label="The Supervisor opens a lane with an outcome and acceptance. Its Lead starts a scout to read the code, then splits the work into tasks by file, one Peer each on its own branch. A Peer hands back; a Reviewer checks it; the Lead accepts it, which merges it into the lane over the gate, or sends it back. The last merge wakes the Lead for a whole-lane review, then it reports the lane ready with the desk&#x27;s facts. The Supervisor lands it: the desk merges the base in, runs the gate, and lands it on your base branch. A turn in the way makes the landing a standing order the desk carries out when it ends; a path you asked to see first waits for you.">
<title>The Supervisor opens a lane with an outcome and acceptance. Its Lead starts a scout to read the code, then splits the work into tasks by file, one Peer each on its own branch. A Peer hands back; a Reviewer checks it; the Lead accepts it, which merges it into the lane over the gate, or sends it back. The last merge wakes the Lead for a whole-lane review, then it reports the lane ready with the desk&#x27;s facts. The Supervisor lands it: the desk merges the base in, runs the gate, and lands it on your base branch. A turn in the way makes the landing a standing order the desk carries out when it ends; a path you asked to see first waits for you.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}.elabel{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.step{font-size:11px;font-weight:700;fill:var(--bg)}</style>
<defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="563" rx="18"/>
<text class="h1" x="32" y="46">A lane, from open to landed</text>
<text class="lede" x="32" y="70">Seats decide; the desk carries each step and hands the next seat the facts.</text>
<rect class="node" x="32" y="118" width="164" height="76" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.6"/>
<text class="title" x="114.0" y="144.0" text-anchor="middle" style="fill:var(--violet-ink)">open_lane</text>
<text class="sub" x="114.0" y="161.0" text-anchor="middle">Supervisor: outcome,</text>
<text class="sub" x="114.0" y="178.0" text-anchor="middle">acceptance, home</text>
<circle cx="34" cy="120" r="10" style="fill:var(--violet)"/>
<text class="step" x="34" y="124" text-anchor="middle">1</text>
<rect class="node" x="214" y="118" width="164" height="76" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.6"/>
<text class="title" x="296.0" y="144.0" text-anchor="middle" style="fill:var(--amber-ink)">Scout</text>
<text class="sub" x="296.0" y="161.0" text-anchor="middle">a Reviewer reads</text>
<text class="sub" x="296.0" y="178.0" text-anchor="middle">the code first</text>
<circle cx="216" cy="120" r="10" style="fill:var(--amber)"/>
<text class="step" x="216" y="124" text-anchor="middle">2</text>
<path class="edge" d="M198,156.0 L210,156.0" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<rect class="node" x="396" y="118" width="164" height="76" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.6"/>
<text class="title" x="478.0" y="144.0" text-anchor="middle" style="fill:var(--blue-ink)">add_tasks</text>
<text class="sub" x="478.0" y="161.0" text-anchor="middle">Lead splits by file,</text>
<text class="sub" x="478.0" y="178.0" text-anchor="middle">one Peer each</text>
<circle cx="398" cy="120" r="10" style="fill:var(--blue)"/>
<text class="step" x="398" y="124" text-anchor="middle">3</text>
<path class="edge" d="M380,156.0 L392,156.0" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<rect class="node" x="578" y="118" width="164" height="76" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.6"/>
<text class="title" x="660.0" y="144.0" text-anchor="middle" style="fill:var(--green-ink)">Peer works</text>
<text class="sub" x="660.0" y="161.0" text-anchor="middle">on its task branch,</text>
<text class="sub" x="660.0" y="178.0" text-anchor="middle">then done</text>
<circle cx="580" cy="120" r="10" style="fill:var(--green)"/>
<text class="step" x="580" y="124" text-anchor="middle">4</text>
<path class="edge" d="M562,156.0 L574,156.0" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<rect class="node" x="760" y="118" width="164" height="76" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.6"/>
<text class="title" x="842.0" y="144.0" text-anchor="middle" style="fill:var(--amber-ink)">Review</text>
<text class="sub" x="842.0" y="161.0" text-anchor="middle">runs its checks;</text>
<text class="sub" x="842.0" y="178.0" text-anchor="middle">the verdict is evidence</text>
<circle cx="762" cy="120" r="10" style="fill:var(--amber)"/>
<text class="step" x="762" y="124" text-anchor="middle">5</text>
<path class="edge" d="M744,156.0 L756,156.0" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<rect class="node" x="32" y="318" width="164" height="76" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.6"/>
<text class="title" x="114.0" y="344.0" text-anchor="middle" style="fill:var(--teal-ink)">LANDED</text>
<text class="sub" x="114.0" y="361.0" text-anchor="middle">on your base branch;</text>
<text class="sub" x="114.0" y="378.0" text-anchor="middle">the Supervisor is told</text>
<circle cx="34" cy="320" r="10" style="fill:var(--teal)"/>
<text class="step" x="34" y="324" text-anchor="middle">10</text>
<rect class="node" x="214" y="318" width="164" height="76" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.6"/>
<text class="title" x="296.0" y="344.0" text-anchor="middle" style="fill:var(--violet-ink)">land_lane</text>
<text class="sub" x="296.0" y="361.0" text-anchor="middle">desk merges the base in,</text>
<text class="sub" x="296.0" y="378.0" text-anchor="middle">runs the gate, lands</text>
<circle cx="216" cy="320" r="10" style="fill:var(--violet)"/>
<text class="step" x="216" y="324" text-anchor="middle">9</text>
<path class="edge" d="M212,356.0 L200,356.0" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<rect class="node" x="396" y="318" width="164" height="76" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.6"/>
<text class="title" x="478.0" y="344.0" text-anchor="middle" style="fill:var(--blue-ink)">report ready</text>
<text class="sub" x="478.0" y="361.0" text-anchor="middle">with the desk&#x27;s facts:</text>
<text class="sub" x="478.0" y="378.0" text-anchor="middle">gate, rehearsals, reviews</text>
<circle cx="398" cy="320" r="10" style="fill:var(--blue)"/>
<text class="step" x="398" y="324" text-anchor="middle">8</text>
<path class="edge" d="M394,356.0 L382,356.0" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<rect class="node" x="578" y="318" width="164" height="76" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.6"/>
<text class="title" x="660.0" y="344.0" text-anchor="middle" style="fill:var(--amber-ink)">Whole-lane review</text>
<text class="sub" x="660.0" y="361.0" text-anchor="middle">the last merge</text>
<text class="sub" x="660.0" y="378.0" text-anchor="middle">wakes the Lead</text>
<circle cx="580" cy="320" r="10" style="fill:var(--amber)"/>
<text class="step" x="580" y="324" text-anchor="middle">7</text>
<path class="edge" d="M576,356.0 L564,356.0" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<rect class="node" x="760" y="318" width="164" height="76" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.6"/>
<text class="title" x="842.0" y="344.0" text-anchor="middle" style="fill:var(--blue-ink)">accept</text>
<text class="sub" x="842.0" y="361.0" text-anchor="middle">Lead merges the task</text>
<text class="sub" x="842.0" y="378.0" text-anchor="middle">into the lane</text>
<circle cx="762" cy="320" r="10" style="fill:var(--blue)"/>
<text class="step" x="762" y="324" text-anchor="middle">6</text>
<path class="edge" d="M758,356.0 L746,356.0" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<path class="edge" d="M842.0,196 L842.0,314" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<text class="elabel" x="850.0" y="262" text-anchor="start">accept</text>
<path class="edge dash" d="M810,116 C810,84 692,84 692,112" style="stroke:var(--red)" marker-end="url(#a-red)"/>
<text class="elabel" x="751" y="88" text-anchor="middle">rework: sent back to its Peer</text>
<path class="edge dash" d="M770,316 L702,200" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<text class="elabel" x="712" y="262" text-anchor="end">more tasks open:</text>
<text class="elabel" x="712" y="276" text-anchor="end">the next one goes on</text>
<rect class="group" x="24" y="424" width="912" height="116" rx="14" style="fill:var(--slate-fill);fill-opacity:0.55;stroke:var(--slate);stroke-opacity:0.25"/>
<text class="group-label" x="40" y="446" style="fill:var(--slate-ink)">WHAT CAN HOLD A LANDING</text>
<text class="note strong" x="40" y="464" text-anchor="start">A seat&#x27;s turn in the way</text>
<text class="note" x="40" y="481" text-anchor="start">the landing becomes a standing order:</text>
<text class="note" x="40" y="498" text-anchor="start">the desk lands once the turn ends and</text>
<text class="note" x="40" y="515" text-anchor="start">says LANDED or NOT LANDED, with why</text>
<text class="note strong" x="340" y="464" text-anchor="start">A red gate or a conflicting base</text>
<text class="note" x="340" y="481" text-anchor="start">not landed: the Lead has the facts;</text>
<text class="note" x="340" y="498" text-anchor="start">the Supervisor lands over a red gate</text>
<text class="note" x="340" y="515" text-anchor="start">only with a reason</text>
<text class="note strong" x="640" y="464" text-anchor="start">You</text>
<text class="note" x="640" y="481" text-anchor="start">in the loop, a path you asked to see</text>
<text class="note" x="640" y="498" text-anchor="start">first waits for your card; out of it,</text>
<text class="note" x="640" y="515" text-anchor="start">an audit lane checks each push</text>
</svg>

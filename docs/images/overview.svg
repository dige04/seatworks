<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="You talk to the Supervisor. The Supervisor opens lanes; each lane has a Lead and a Peer per task. Around them, Reviewers give the Lead evidence and the watch tells the Supervisor what it sees. Under them the desk keeps the record, carries the mail, makes branches and copies, runs the gate, and merges and lands."><title>You talk to the Supervisor. The Supervisor opens lanes; each lane has a Lead and a Peer per task. Around them, Reviewers give the Lead evidence and the watch tells the Supervisor what it sees. Under them the desk keeps the record, carries the mail, makes branches and copies, runs the gate, and merges and lands.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="719" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">Seatworks at a glance</text><text class="lede" x="32" y="72">SLP at the core, review and the watch around it, and a desk under all of them that decides none of the work.</text><rect x="24" y="96" width="912" height="92" rx="14" style="fill:var(--slate-fill);fill-opacity:0.5;stroke:var(--slate);stroke-opacity:0.28"/><text class="band-label" x="40" y="118" style="fill:var(--slate-ink)">YOU</text><rect x="48" y="122" width="300" height="52" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="198.0" y="144.5" text-anchor="middle" style="fill:var(--slate-ink)">Human</text><text class="s" x="198.0" y="161.5" text-anchor="middle">sets the intent, settles the concept</text><rect x="612" y="122" width="300" height="52" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="762.0" y="144.5" text-anchor="middle" style="fill:var(--slate-ink)">Paseo app</text><text class="s" x="762.0" y="161.5" text-anchor="middle">the Supervisor's chat · Team tab · setup</text><rect x="24" y="204" width="912" height="268" rx="14" style="fill:var(--violet-fill);fill-opacity:0.5;stroke:var(--violet);stroke-opacity:0.28"/><text class="band-label" x="40" y="226" style="fill:var(--violet-ink)">SLP · THE TEAM</text><rect x="330" y="230" width="300" height="56" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="254.5" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text><text class="s" x="480.0" y="271.5" text-anchor="middle">your intent; opens and lands lanes</text><path class="edge" d="M260,174 L260.0,249.0 Q260,258 269.0,258.0 L326,258" style="stroke:var(--slate)" marker-end="url(#a-slate)"/><rect x="200.5" y="222" width="119.0" height="20" rx="10" style="fill:var(--bg);stroke:var(--slate);stroke-opacity:0.55"/><text class="chip" x="260" y="236" text-anchor="middle" style="fill:var(--slate-ink)">intent · answers</text><path class="edge" d="M700,174 L700.0,249.0 Q700,258 691.0,258.0 L634,258" style="stroke:var(--violet)" marker-start="url(#a-violet)"/><rect x="634.0" y="222" width="131.9" height="20" rx="10" style="fill:var(--bg);stroke:var(--slate);stroke-opacity:0.55"/><text class="chip" x="700" y="236" text-anchor="middle" style="fill:var(--slate-ink)">questions · report</text><path class="edge" d="M480,286 L480,322" style="stroke:var(--violet)"/><path class="edge" d="M188,322 L772,322" style="stroke:var(--violet)"/><path class="edge" d="M188,322 L188,340" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="48" y="344" width="280" height="112" rx="14" style="fill:var(--blue-fill);fill-opacity:0.5;stroke:var(--blue);stroke-opacity:0.28"/><text class="band-label" x="64" y="366" style="fill:var(--blue-ink)">LANE 1</text><rect x="118" y="358" width="140" height="40" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="188.0" y="383.0" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text><rect x="64" y="414" width="80" height="32" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="104.0" y="435.0" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><rect x="148" y="414" width="80" height="32" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="188.0" y="435.0" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><rect x="232" y="414" width="80" height="32" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="272.0" y="435.0" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><path class="edge" d="M188,398 L188,410" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><path class="edge" d="M480,322 L480,340" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="340" y="344" width="280" height="112" rx="14" style="fill:var(--blue-fill);fill-opacity:0.5;stroke:var(--blue);stroke-opacity:0.28"/><text class="band-label" x="356" y="366" style="fill:var(--blue-ink)">LANE 2</text><rect x="410" y="358" width="140" height="40" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="383.0" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text><rect x="356" y="414" width="80" height="32" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="396.0" y="435.0" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><rect x="440" y="414" width="80" height="32" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="435.0" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><rect x="524" y="414" width="80" height="32" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="564.0" y="435.0" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><path class="edge" d="M480,398 L480,410" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><path class="edge" d="M772,322 L772,340" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="632" y="344" width="280" height="112" rx="14" style="fill:var(--blue-fill);fill-opacity:0.5;stroke:var(--blue);stroke-opacity:0.28"/><text class="band-label" x="648" y="366" style="fill:var(--blue-ink)">LANE 3</text><rect x="702" y="358" width="140" height="40" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="772.0" y="383.0" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text><rect x="648" y="414" width="80" height="32" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="688.0" y="435.0" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><rect x="732" y="414" width="80" height="32" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="772.0" y="435.0" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><rect x="816" y="414" width="80" height="32" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="856.0" y="435.0" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><path class="edge" d="M772,398 L772,410" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><rect x="404.4" y="294" width="151.2" height="20" rx="10" style="fill:var(--bg);stroke:var(--violet);stroke-opacity:0.55"/><text class="chip" x="480" y="308" text-anchor="middle" style="fill:var(--violet-ink)">open_lane · land_lane</text><rect x="24" y="488" width="912" height="108" rx="14" style="fill:var(--amber-fill);fill-opacity:0.5;stroke:var(--amber);stroke-opacity:0.28"/><rect x="48" y="500" width="420" height="84" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.7;stroke-width:1.4"/><text class="k" x="258.0" y="521.5" text-anchor="middle" style="fill:var(--amber)">R</text><text class="t" x="258.0" y="538.5" text-anchor="middle" style="fill:var(--amber-ink)">Review</text><text class="s" x="258.0" y="555.5" text-anchor="middle">a Reviewer reads a change in its own copy;</text><text class="s" x="258.0" y="572.5" text-anchor="middle">its verdict is evidence for the Lead</text><rect x="492" y="500" width="420" height="84" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="k" x="702.0" y="521.5" text-anchor="middle" style="fill:var(--rose)">W</text><text class="t" x="702.0" y="538.5" text-anchor="middle" style="fill:var(--rose-ink)">Watch</text><text class="s" x="702.0" y="555.5" text-anchor="middle">reads Leads and Peers and tells the</text><text class="s" x="702.0" y="572.5" text-anchor="middle">Supervisor what it sees; never steps in</text><rect x="24" y="612" width="912" height="84" rx="14" style="fill:var(--teal-fill);fill-opacity:0.5;stroke:var(--teal);stroke-opacity:0.28"/><text class="band-label" x="40" y="634" style="fill:var(--teal-ink)">THE DESK · INSIDE THE PASEO DAEMON</text><rect x="48" y="640" width="160" height="40" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="128.0" y="665.0" text-anchor="middle" style="fill:var(--teal-ink)">the record</text><rect x="224" y="640" width="160" height="40" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="304.0" y="665.0" text-anchor="middle" style="fill:var(--teal-ink)">mail</text><rect x="400" y="640" width="160" height="40" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="665.0" text-anchor="middle" style="fill:var(--teal-ink)">branches &amp; copies</text><rect x="576" y="640" width="160" height="40" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="656.0" y="665.0" text-anchor="middle" style="fill:var(--teal-ink)">the gate</text><rect x="752" y="640" width="160" height="40" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="832.0" y="665.0" text-anchor="middle" style="fill:var(--teal-ink)">merge and land</text></svg>

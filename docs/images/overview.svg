<svg xmlns="http://www.w3.org/2000/svg" width="960" height="872" viewBox="0 0 960 872" role="img" aria-label="You talk to the Supervisor in Paseo. The Supervisor opens lanes; each lane has a Lead, a Peer per task, and Reviewers, seats like Peers whose one job is to review. The watch reads Leads and Peers and reports only to the Supervisor. Every seat calls the desk through its tools; the desk answers with letters, runs git for everyone, keeps the record outside your repository, and decides none of the work."><title>You talk to the Supervisor in Paseo. The Supervisor opens lanes; each lane has a Lead, a Peer per task, and Reviewers, seats like Peers whose one job is to review. The watch reads Leads and Peers and reports only to the Supervisor. Every seat calls the desk through its tools; the desk answers with letters, runs git for everyone, keeps the record outside your repository, and decides none of the work.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="871" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">Seatworks at a glance</text><text class="lede" x="32" y="72">The team decides; the watch reports; the desk carries every call, letter and branch between them.</text><rect x="24" y="96" width="912" height="80" rx="14" style="fill:var(--slate-fill);fill-opacity:0.5;stroke:var(--slate);stroke-opacity:0.28"/><rect x="48" y="116" width="300" height="48" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="198.0" y="136.5" text-anchor="middle" style="fill:var(--slate-ink)">Human</text><text class="s" x="198.0" y="153.5" text-anchor="middle">intent · the concept</text><rect x="612" y="116" width="300" height="48" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="762.0" y="136.5" text-anchor="middle" style="fill:var(--slate-ink)">Paseo app</text><text class="s" x="762.0" y="153.5" text-anchor="middle">the Supervisor's chat · Team tab · setup</text><rect x="24" y="196" width="676" height="376" rx="14" style="fill:var(--violet-fill);fill-opacity:0.5;stroke:var(--violet);stroke-opacity:0.28"/><text class="band-label" x="40" y="218" style="fill:var(--violet-ink)">SLP · THE TEAM</text><rect x="206" y="222" width="312" height="52" rx="10" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="362.0" y="244.5" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text><text class="s" x="362.0" y="261.5" text-anchor="middle">your intent across lanes; lands lanes</text><path class="edge" d="M260,164 L260,218" style="stroke:var(--slate)" marker-end="url(#a-slate)"/><rect x="232.7" y="176" width="54.6" height="20" rx="10" style="fill:var(--bg);stroke:var(--slate);stroke-opacity:0.55"/><text class="chip" x="260" y="190" text-anchor="middle" style="fill:var(--slate-ink)">intent</text><path class="edge" d="M522,248 L571.0,248.0 Q580,248 580.0,239.0 L580.0,195.0 Q580,186 589.0,186.0 L753.0,186.0 Q762,186 762.0,177.0 L762,168" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="606.0" y="176" width="131.9" height="20" rx="10" style="fill:var(--bg);stroke:var(--violet);stroke-opacity:0.55"/><text class="chip" x="672" y="190" text-anchor="middle" style="fill:var(--violet-ink)">questions · report</text><path class="edge" d="M362,274 L362,296" style="stroke:var(--violet)"/><path class="edge" d="M198,296 L526,296" style="stroke:var(--violet)"/><path class="edge" d="M198,296 L198,316" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="44" y="320" width="308" height="236" rx="14" style="fill:var(--blue-fill);fill-opacity:0.5;stroke:var(--blue);stroke-opacity:0.28"/><text class="band-label" x="60" y="342" style="fill:var(--blue-ink)">LANE 1 · A BRANCH OR COPY</text><rect x="128" y="352" width="140" height="44" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="198.0" y="370.5" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text><text class="s" x="198.0" y="387.5" text-anchor="middle">one lane</text><rect x="58" y="432" width="88" height="52" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="102.0" y="454.5" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><text class="s" x="102.0" y="471.5" text-anchor="middle">a task</text><rect x="154" y="432" width="88" height="52" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="198.0" y="454.5" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><text class="s" x="198.0" y="471.5" text-anchor="middle">a task</text><rect x="250" y="432" width="88" height="52" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="294.0" y="454.5" text-anchor="middle" style="fill:var(--amber-ink)">Reviewer</text><text class="s" x="294.0" y="471.5" text-anchor="middle">a review</text><path class="edge" d="M198,396 L198.0,405.0 Q198,414 189.0,414.0 L111.0,414.0 Q102,414 102.0,421.0 L102,428" style="stroke:var(--blue)"/><path class="edge" d="M102,414 L285.0,414.0 Q294,414 294.0,421.0 L294,428" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><path class="edge" d="M198,414 L198,428" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><text class="note" x="60" y="512" text-anchor="start">A Reviewer is a seat like a Peer,</text><text class="note" x="60" y="530" text-anchor="start">with one job: review, and change nothing.</text><path class="edge" d="M526,296 L526,316" style="stroke:var(--violet)" marker-end="url(#a-violet)"/><rect x="372" y="320" width="308" height="236" rx="14" style="fill:var(--blue-fill);fill-opacity:0.5;stroke:var(--blue);stroke-opacity:0.28"/><text class="band-label" x="388" y="342" style="fill:var(--blue-ink)">LANE 2</text><rect x="456" y="352" width="140" height="44" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="526.0" y="370.5" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text><text class="s" x="526.0" y="387.5" text-anchor="middle">one lane</text><rect x="386" y="432" width="88" height="52" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="430.0" y="454.5" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><text class="s" x="430.0" y="471.5" text-anchor="middle">a task</text><rect x="482" y="432" width="88" height="52" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="526.0" y="454.5" text-anchor="middle" style="fill:var(--green-ink)">Peer</text><text class="s" x="526.0" y="471.5" text-anchor="middle">a task</text><rect x="578" y="432" width="88" height="52" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="622.0" y="454.5" text-anchor="middle" style="fill:var(--amber-ink)">Reviewer</text><text class="s" x="622.0" y="471.5" text-anchor="middle">a review</text><path class="edge" d="M526,396 L526.0,405.0 Q526,414 517.0,414.0 L439.0,414.0 Q430,414 430.0,421.0 L430,428" style="stroke:var(--blue)"/><path class="edge" d="M430,414 L613.0,414.0 Q622,414 622.0,421.0 L622,428" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><path class="edge" d="M526,414 L526,428" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><text class="note" x="388" y="512" text-anchor="start">Lanes run side by side, each on</text><text class="note" x="388" y="530" text-anchor="start">a branch or a copy of its own.</text><rect x="286.4" y="286" width="151.2" height="20" rx="10" style="fill:var(--bg);stroke:var(--violet);stroke-opacity:0.55"/><text class="chip" x="362" y="300" text-anchor="middle" style="fill:var(--violet-ink)">open_lane · land_lane</text><rect x="716" y="196" width="220" height="376" rx="14" style="fill:var(--rose-fill);fill-opacity:0.5;stroke:var(--rose);stroke-opacity:0.28"/><text class="band-label" x="732" y="218" style="fill:var(--rose-ink)">W · THE WATCH</text><rect x="732" y="234" width="188" height="96" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="826.0" y="261.5" text-anchor="middle" style="fill:var(--rose-ink)">Watch</text><text class="s" x="826.0" y="278.5" text-anchor="middle">reads each Lead's and</text><text class="s" x="826.0" y="295.5" text-anchor="middle">Peer's thinking, words</text><text class="s" x="826.0" y="312.5" text-anchor="middle">and desk calls</text><rect x="732" y="360" width="188" height="76" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="826.0" y="386.0" text-anchor="middle" style="fill:var(--rose-ink)">Incidents</text><text class="s" x="826.0" y="403.0" text-anchor="middle">to the Supervisor</text><text class="s" x="826.0" y="420.0" text-anchor="middle">only</text><path class="edge" d="M826,330 L826,356" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><path class="edge" d="M732,398 L717.0,398.0 Q708,398 708.0,389.0 L708.0,271.0 Q708,262 699.0,262.0 L522,262" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><path class="edge dash" d="M716,470 L686,470" style="stroke:var(--rose)" marker-end="url(#a-rose)"/><rect x="801.9" y="460" width="48.2" height="20" rx="10" style="fill:var(--bg);stroke:var(--rose);stroke-opacity:0.55"/><text class="chip" x="826" y="474" text-anchor="middle" style="fill:var(--rose-ink)">reads</text><text class="note" x="732" y="520" text-anchor="start">Never tells the seat it</text><text class="note" x="732" y="538" text-anchor="start">watches; never steps in.</text><rect x="24" y="604" width="912" height="248" rx="14" style="fill:var(--teal-fill);fill-opacity:0.5;stroke:var(--teal);stroke-opacity:0.28"/><text class="band-label" x="40" y="626" style="fill:var(--teal-ink)">THE DESK · INSIDE PASEO'S DAEMON · CARRIES, NEVER DECIDES</text><rect x="44" y="636" width="272" height="76" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="180.0" y="662.0" text-anchor="middle" style="fill:var(--teal-ink)">Tool calls in</text><text class="s" x="180.0" y="679.0" text-anchor="middle">open_lane · add_tasks · done</text><text class="s" x="180.0" y="696.0" text-anchor="middle">accept · report · land_lane</text><rect x="344" y="636" width="272" height="76" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="662.0" text-anchor="middle" style="fill:var(--teal-ink)">Desk</text><text class="s" x="480.0" y="679.0" text-anchor="middle">checks each call against</text><text class="s" x="480.0" y="696.0" text-anchor="middle">the record, then carries it</text><rect x="644" y="636" width="272" height="76" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="780.0" y="662.0" text-anchor="middle" style="fill:var(--teal-ink)">Letters out</text><text class="s" x="780.0" y="679.0" text-anchor="middle">MERGED · READY · LANDED</text><text class="s" x="780.0" y="696.0" text-anchor="middle">each ends with what it asks</text><path class="edge" d="M316,674 L340,674" style="stroke:var(--teal)" marker-end="url(#a-teal)"/><path class="edge" d="M616,674 L640,674" style="stroke:var(--teal)" marker-end="url(#a-teal)"/><rect x="44" y="740" width="272" height="88" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="180.0" y="772.0" text-anchor="middle" style="fill:var(--teal-ink)">Git, for every seat</text><text class="s" x="180.0" y="789.0" text-anchor="middle">a branch and copy per task;</text><text class="s" x="180.0" y="806.0" text-anchor="middle">the gate; merge; land</text><rect x="344" y="740" width="272" height="88" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="772.0" text-anchor="middle" style="fill:var(--teal-ink)">The record</text><text class="s" x="480.0" y="789.0" text-anchor="middle">ledger, incidents, hand-backs,</text><text class="s" x="480.0" y="806.0" text-anchor="middle">outside your repository</text><rect x="644" y="740" width="272" height="88" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="780.0" y="772.0" text-anchor="middle" style="fill:var(--teal-ink)">Paseo</text><text class="s" x="780.0" y="789.0" text-anchor="middle">starts each seat on its role;</text><text class="s" x="780.0" y="806.0" text-anchor="middle">delivers each letter</text><path class="edge" d="M480,712 L480,736" style="stroke:var(--teal)" marker-end="url(#a-teal)"/><path class="edge" d="M180,556 L180,632" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><rect x="139.8" y="578" width="80.4" height="20" rx="10" style="fill:var(--bg);stroke:var(--blue);stroke-opacity:0.55"/><text class="chip" x="180" y="592" text-anchor="middle" style="fill:var(--blue-ink)">tool calls</text><path class="edge" d="M780,636 L780.0,621.0 Q780,612 771.0,612.0 L569.0,612.0 Q560,612 560.0,603.0 L560,560" style="stroke:var(--teal)" marker-end="url(#a-teal)"/><rect x="529.5" y="578" width="61.1" height="20" rx="10" style="fill:var(--bg);stroke:var(--teal);stroke-opacity:0.55"/><text class="chip" x="560" y="592" text-anchor="middle" style="fill:var(--teal-ink)">letters</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-label="The Paseo app shows the Supervisor&#x27;s chat, the Team tab and the setup page, and talks to the plugin over panel RPC. Each seat is an agent in a directory of its own, with its role&#x27;s prompt, skills and rules, a team MCP server that carries its tool calls to the desk over desk.sock, and a git shim. Inside the daemon the plugin&#x27;s runtime holds Paseo&#x27;s hooks, the outbox and the watch; the desk holds the use cases; the catalog is the kit of roles, prompts, skills, settings and patterns. The record lives under ~/.local/share/seatworks-v3, and lanes work in your checkout or in worktrees."><title>The Paseo app shows the Supervisor's chat, the Team tab and the setup page, and talks to the plugin over panel RPC. Each seat is an agent in a directory of its own, with its role's prompt, skills and rules, a team MCP server that carries its tool calls to the desk over desk.sock, and a git shim. Inside the daemon the plugin's runtime holds Paseo's hooks, the outbox and the watch; the desk holds the use cases; the catalog is the kit of roles, prompts, skills, settings and patterns. The record lives under ~/.local/share/seatworks-v3, and lanes work in your checkout or in worktrees.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="789" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">How it is built</text><text class="lede" x="32" y="72">One plugin inside Paseo's daemon; one agent per seat; the record on disk, outside your repository.</text><rect x="24" y="96" width="440" height="170" rx="14" style="fill:var(--slate-fill);fill-opacity:0.5;stroke:var(--slate);stroke-opacity:0.28"/><text class="band-label" x="40" y="118" style="fill:var(--slate-ink)">PASEO APP</text><rect x="44" y="128" width="400" height="56" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="244.0" y="152.5" text-anchor="middle" style="fill:var(--slate-ink)">The Supervisor's chat</text><text class="s" x="244.0" y="169.5" text-anchor="middle">question, landing and report cards; a pill in every chat</text><rect x="44" y="196" width="400" height="56" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="244.0" y="220.5" text-anchor="middle" style="fill:var(--slate-ink)">Team tab · Seatworks page</text><text class="s" x="244.0" y="237.5" text-anchor="middle">the team at a glance · projects, rules, MCP, health</text><rect x="496" y="96" width="440" height="170" rx="14" style="fill:var(--green-fill);fill-opacity:0.5;stroke:var(--green);stroke-opacity:0.28"/><text class="band-label" x="512" y="118" style="fill:var(--green-ink)">SEATS · ONE AGENT EACH</text><rect x="516" y="124" width="196" height="62" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="614.0" y="143.0" text-anchor="middle" style="fill:var(--green-ink)">Agent</text><text class="s" x="614.0" y="160.0" text-anchor="middle">Claude Code, Codex, Pi,</text><text class="s" x="614.0" y="177.0" text-anchor="middle">Oh My Pi or OpenCode</text><rect x="724" y="124" width="192" height="62" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="820.0" y="143.0" text-anchor="middle" style="fill:var(--green-ink)">Seat directory</text><text class="s" x="820.0" y="160.0" text-anchor="middle">prompt, skills, sandbox,</text><text class="s" x="820.0" y="177.0" text-anchor="middle">deny rules</text><rect x="516" y="194" width="196" height="58" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="614.0" y="219.5" text-anchor="middle" style="fill:var(--green-ink)">team MCP server</text><text class="s" x="614.0" y="236.5" text-anchor="middle">the role's desk tools</text><rect x="724" y="194" width="192" height="58" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="820.0" y="219.5" text-anchor="middle" style="fill:var(--green-ink)">git shim</text><text class="s" x="820.0" y="236.5" text-anchor="middle">refuses the desk's git</text><rect x="24" y="312" width="912" height="280" rx="14" style="fill:var(--teal-fill);fill-opacity:0.5;stroke:var(--teal);stroke-opacity:0.28"/><text class="band-label" x="40" y="334" style="fill:var(--teal-ink)">PASEO DAEMON · THE SEATWORKS PLUGIN</text><rect x="44" y="344" width="260" height="96" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="174.0" y="371.5" text-anchor="middle" style="fill:var(--teal-ink)">runtime</text><text class="s" x="174.0" y="388.5" text-anchor="middle">Paseo's hooks · panel RPC</text><text class="s" x="174.0" y="405.5" text-anchor="middle">the patrol · the outbox</text><text class="s" x="174.0" y="422.5" text-anchor="middle">the watch's eye</text><rect x="350" y="344" width="260" height="96" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="380.0" text-anchor="middle" style="fill:var(--teal-ink)">desk.sock</text><text class="s" x="480.0" y="397.0" text-anchor="middle">every seat's tool call</text><text class="s" x="480.0" y="414.0" text-anchor="middle">comes in here</text><rect x="656" y="344" width="260" height="96" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="786.0" y="371.5" text-anchor="middle" style="fill:var(--teal-ink)">catalog</text><text class="s" x="786.0" y="388.5" text-anchor="middle">roles.json, prompts, skills,</text><text class="s" x="786.0" y="405.5" text-anchor="middle">harness settings, patterns;</text><text class="s" x="786.0" y="422.5" text-anchor="middle">builds each seat</text><rect x="44" y="468" width="260" height="100" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="174.0" y="497.5" text-anchor="middle" style="fill:var(--teal-ink)">desk</text><text class="s" x="174.0" y="514.5" text-anchor="middle">lanes · tasks · review · waiting</text><text class="s" x="174.0" y="531.5" text-anchor="middle">human · watch · copies</text><text class="s" x="174.0" y="548.5" text-anchor="middle">letters · the record</text><rect x="350" y="468" width="260" height="100" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="506.0" text-anchor="middle" style="fill:var(--teal-ink)">domain</text><text class="s" x="480.0" y="523.0" text-anchor="middle">lane, task, ask, question and</text><text class="s" x="480.0" y="540.0" text-anchor="middle">incident lifecycles</text><rect x="656" y="468" width="260" height="100" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="786.0" y="506.0" text-anchor="middle" style="fill:var(--teal-ink)">core and adapters</text><text class="s" x="786.0" y="523.0" text-anchor="middle">git, files, time; Paseo's</text><text class="s" x="786.0" y="540.0" text-anchor="middle">ports; the sensor's client</text><path class="edge" d="M244,266 L244,340" style="stroke:var(--slate)" marker-end="url(#a-slate)" marker-start="url(#a-slate)"/><rect x="207.0" y="280" width="74.0" height="20" rx="10" style="fill:var(--bg);stroke:var(--slate);stroke-opacity:0.55"/><text class="chip" x="244" y="294" text-anchor="middle" style="fill:var(--slate-ink)">panel RPC</text><path class="edge" d="M614,266 L614.0,291.0 Q614,300 605.0,300.0 L529.0,300.0 Q520,300 520.0,309.0 L520,340" style="stroke:var(--green)" marker-end="url(#a-green)"/><rect x="525.8" y="290" width="80.4" height="20" rx="10" style="fill:var(--bg);stroke:var(--green);stroke-opacity:0.55"/><text class="chip" x="566" y="304" text-anchor="middle" style="fill:var(--green-ink)">tool calls</text><path class="edge" d="M826,340 L826,270" style="stroke:var(--teal)" marker-end="url(#a-teal)"/><rect x="766.5" y="286" width="119.0" height="20" rx="10" style="fill:var(--bg);stroke:var(--teal);stroke-opacity:0.55"/><text class="chip" x="826" y="300" text-anchor="middle" style="fill:var(--teal-ink)">builds each seat</text><path class="edge" d="M174,440 L174,464" style="stroke:var(--teal)" marker-end="url(#a-teal)"/><path class="edge" d="M480,440 L480.0,447.0 Q480,454 471.0,454.0 L183.0,454.0 Q174,45
.0" y="730.0" text-anchor="middle">the Seatworks block</text><rect x="724" y="668" width="192" height="80" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="820.0" y="696.0" text-anchor="middle" style="fill:var(--blue-ink)">worktrees</text><text class="s" x="820.0" y="713.0" text-anchor="middle">a lane's copy; a task's</text><text class="s" x="820.0" y="730.0" text-anchor="middle">branch and copy</text><path class="edge" d="M174,568 L174,632" style="stroke:var(--teal)" marker-end="url(#a-teal)"/><rect x="133.8" y="592" width="80.4" height="20" rx="10" style="fill:var(--bg);stroke:var(--teal);stroke-opacity:0.55"/><text class="chip" x="174" y="606" text-anchor="middle" style="fill:var(--teal-ink)">the record</text><path class="edge" d="M786,568 L786,632" style="stroke:var(--teal)" marker-end="url(#a-teal)"/><rect x="687.8" y="592" width="196.3" height="20" rx="10" style="fill:var(--bg);stroke:var(--teal);stroke-opacity:0.55"/><text class="chip" x="786" y="606" text-anchor="middle" style="fill:var(--teal-ink)">branches · merges · landings</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="A Lead starts a review when a doubt a reader can settle calls for one: a scout&#x27;s question where a split would be blind, one task&#x27;s change, the whole lane where its tasks met in code nobody read whole, a lens of a council, an Architect&#x27;s judgment on a hard design, or an Auditor&#x27;s run of the lane&#x27;s proof. The Reviewer reads the diff before the messages, proves each acceptance behaviour with a check it ran, reports every defect with a severity from P0 to P3, and changes nothing. The Lead sends reproduced P0 to P2 back, carries P3 in its report, and accepts when nothing material is found."><title>A Lead starts a review when a doubt a reader can settle calls for one: a scout's question where a split would be blind, one task's change, the whole lane where its tasks met in code nobody read whole, a lens of a council, an Architect's judgment on a hard design, or an Auditor's run of the lane's proof. The Reviewer reads the diff before the messages, proves each acceptance behaviour with a check it ran, reports every defect with a severity from P0 to P3, and changes nothing. The Lead sends reproduced P0 to P2 back, carries P3 in its report, and accepts when nothing material is found.</title><style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--faint:#8c959f;--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.h1{font-size:22px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.band-label{font-size:11px;font-weight:700;letter-spacing:0.09em}.t{font-size:14.5px;font-weight:640}.s{font-size:12.5px;fill:var(--muted)}.k{font-size:11px;font-weight:700;letter-spacing:0.06em}.chip{font-size:11.5px;font-weight:560}.badge{font-size:11.5px;font-weight:700;fill:var(--bg)}.note{font-size:12.5px;fill:var(--muted)}.strongish{fill:var(--ink);font-size:13px}.strong{font-weight:640;fill:var(--ink)}.edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}</style><defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="639" rx="18" style="fill:var(--bg);stroke:var(--line)"/><text class="h1" x="32" y="48">R: review is evidence, not a verdict</text><text class="lede" x="32" y="72">A Reviewer reads in a copy of its own and changes nothing; its Lead weighs what it reports.</text><rect x="24" y="96" width="280" height="432" rx="14" style="fill:var(--blue-fill);fill-opacity:0.5;stroke:var(--blue);stroke-opacity:0.28"/><text class="band-label" x="40" y="118" style="fill:var(--blue-ink)">WHAT A LEAD ASKS FOR, ON A DOUBT</text><rect x="44" y="128" width="240" height="76" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="164.0" y="154.0" text-anchor="middle" style="fill:var(--blue-ink)">Scout</text><text class="s" x="164.0" y="171.0" text-anchor="middle">a question on the code,</text><text class="s" x="164.0" y="188.0" text-anchor="middle">where a split is blind</text><path class="edge" d="M284,166 L312,166" style="stroke:var(--blue)"/><rect x="44" y="226" width="240" height="76" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="164.0" y="252.0" text-anchor="middle" style="fill:var(--blue-ink)">Change review</text><text class="s" x="164.0" y="269.0" text-anchor="middle">one task's change, when</text><text class="s" x="164.0" y="286.0" text-anchor="middle">a doubt calls for it</text><path class="edge" d="M284,264 L312,264" style="stroke:var(--blue)"/><rect x="44" y="324" width="240" height="76" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="164.0" y="350.0" text-anchor="middle" style="fill:var(--blue-ink)">Whole-lane review</text><text class="s" x="164.0" y="367.0" text-anchor="middle">where tasks met in code</text><text class="s" x="164.0" y="384.0" text-anchor="middle">nobody read whole</text><path class="edge" d="M284,362 L312,362" style="stroke:var(--blue)"/><rect x="44" y="422" width="240" height="76" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="164.0" y="448.0" text-anchor="middle" style="fill:var(--blue-ink)">Council · Architect</text><text class="s" x="164.0" y="465.0" text-anchor="middle">lenses on a hard call;</text><text class="s" x="164.0" y="482.0" text-anchor="middle">an Auditor for the proof</text><path class="edge" d="M284,460 L312,460" style="stroke:var(--blue)"/><path class="edge" d="M312,166 L312,460" style="stroke:var(--blue)"/><path class="edge" d="M312,312 L336,312" style="stroke:var(--blue)" marker-end="url(#a-blue)"/><rect x="340" y="96" width="280" height="432" rx="14" style="fill:var(--amber-fill);fill-opacity:0.5;stroke:var(--amber);stroke-opacity:0.28"/><text class="band-label" x="356" y="118" style="fill:var(--amber-ink)">THE REVIEWER</text><rect x="360" y="128" width="240" height="60" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="480.0" y="154.5" text-anchor="middle" style="fill:var(--amber-ink)">A copy of its own</text><text class="s" x="480.0" y="171.5" text-anchor="middle">at the commit it reviews</text><circle cx="376" cy="224" r="11" style="fill:var(--amber)"/><text class="badge" x="376" y="228" text-anchor="middle">1</text><text class="note" x="398" y="220" text-anchor="start">reads the diff before</text><text class="note" x="398" y="238" text-anchor="start">the messages</text><circle cx="376" cy="284" r="11" style="fill:var(--amber)"/><text class="badge" x="376" y="288" text-anchor="middle">2</text><text class="note" x="398" y="280" text-anchor="start">proves each acceptance</text><text class="note" x="398" y="298" text-anchor="start">with a check it ran</text><circle cx="376" cy="344" r="11" style="fill:var(--amber)"/><text class="badge" x="376" y="348" text-anchor="middle">3</text><text class="note" x="398" y="340" text-anchor="start">reports every defect,</text><text class="note" x="398" y="358" text-anchor="start">reproduced or traced</text><circle cx="376" cy="404" r="11" style="fill:var(--amber)"/><text class="badge" x="376" y="408" text-anchor="middle">4</text><text class="note" x="398" y="400" text-anchor="start">rates P0 to P3 by what</text><text class="note" x="398" y="418" text-anchor="start">a user would meet</text><circle cx="376" cy="464" r="11" style="fill:var(--amber)"/><text class="badge" x="376" y="468" text-anchor="middle">5</text><text class="note" x="398" y="460" text-anchor="start">changes nothing</text><text class="note" x="398" y="478" text-anchor="start">of the work</text><rect x="656" y="96" width="280" height="432" rx="14" style="fill:var(--green-fill);fill-opacity:0.5;stroke:var(--green);stroke-opacity:0.28"/><text class="band-label" x="672" y="118" style="fill:var(--green-ink)">THE LEAD WEIGHS IT</text><rect x="676" y="140" width="240" height="80" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="796.0" y="168.0" text-anchor="middle" style="fill:var(--green-ink)">Accept</text><text class="s" x="796.0" y="185.0" text-anchor="middle">nothing material found:</text><text class="s" x="796.0" y="202.0" text-anchor="middle">the desk merges it</text><path class="edge" d="M648,180 L672,180" style="stroke:var(--green)" marker-end="url(#a-green)"/><rect x="676" y="264" width="240" height="80" rx="10" style="fill:var(--red-fill);stroke:var(--red);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="796.0" y="292.0" text-anchor="middle" style="fill:var(--red-ink)">Rework</text><text class="s" x="796.0" y="309.0" text-anchor="middle">P0 to P2, reproduced:</text><text class="s" x="796.0" y="326.0" text-anchor="middle">back to its Peer</text><path class="edge" d="M648,304 L672,304" style="stroke:var(--red)" marker-end="url(#a-red)"/><rect x="676" y="388" width="240" height="80" rx="10" style="fill:var(--amber-fill);stroke:var(--amber);stroke-opacity:0.7;stroke-width:1.4"/><text class="t" x="796.0" y="416.0" text-anchor="middle" style="fill:var(--amber-ink)">Carry</text><text class="s" x="796.0" y="433.0" text-anchor="middle">P3: named in the lane's</text><text class="s" x="796.0" y="450.0" text-anchor="middle">report, not sent back</text><path class="edge" d="M648,428 L672,428" style="stroke:var(--amber)" marker-end="url(#a-amber)"/><path class="edge" d="M620,312 L648,312" style="stroke:var(--amber)"/><path class="edge" d="M648,180 L648,428" style="stroke:var(--amber)"/><rect x="24" y="544" width="912" height="76" rx="14" style="fill:var(--slate-fill);fill-opacity:0.5;stroke:var(--slate);stroke-opacity:0.28"/><text class="note strong" x="44" y="572" text-anchor="start">What the desk and the watch add</text><text class="note" x="44" y="590" text-anchor="start">a review opened after READY takes it back · an accept on a review that ran nothing is a fact · the Report counts what each changed</text></svg>
